name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.5.11"
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint, Types, Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Tests
        run: uv run pytest --cov=teabot --cov-report=term-missing

  migrations:
    name: Migration check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      # Läuft die Migrationskette auf einer leeren DB sauber durch?
      - name: Upgrade to head
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: uv run alembic upgrade head

      # Fängt vergessene Migrationen: Modelle und Head müssen deckungsgleich sein.
      - name: Detect missing migrations
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: |
          uv run alembic check || {
            echo "::error::Modelländerung ohne Migration. Bitte 'alembic revision --autogenerate' ausführen."
            exit 1
          }

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [quality, migrations]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: teabot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
