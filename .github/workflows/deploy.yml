name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch oder Tag zum Deployen"
        required: false
        default: "main"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fuchs
    # Runner läuft nativ auf Fuchs, auf derselben Maschine wie Docker.
    # Das zweite Label stellt sicher, dass der Job auf genau diesem Host
    # landet, falls später weitere Runner dazukommen.
    runs-on: [self-hosted, fuchs]
    environment: production

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Show target
        run: |
          echo "Ref:    ${{ inputs.ref || github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

      - name: Preflight
        run: |
          [ -n "${DEPLOY_DIR}" ] || { echo "::error::vars.DEPLOY_DIR nicht gesetzt"; exit 1; }
          [ -f "${DEPLOY_DIR}/.env" ] || { echo "::error::${DEPLOY_DIR}/.env fehlt"; exit 1; }
          for KEY in DISCORD_TOKEN DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET SESSION_SECRET APP_PORT DATABASE_URL; do
            grep -q "^${KEY}=." "${DEPLOY_DIR}/.env" || { echo "::error::${KEY} fehlt in .env"; exit 1; }
          done
          command -v sqlite3 >/dev/null || { echo "::error::sqlite3 fehlt auf dem Host"; exit 1; }
          [ -d "${DEPLOY_DIR}/data" ] || { echo "::error::${DEPLOY_DIR}/data fehlt"; exit 1; }
          [ "$(stat -c '%u' "${DEPLOY_DIR}/data")" = "10001" ] \
            || { echo "::error::${DEPLOY_DIR}/data gehört nicht UID 10001"; exit 1; }
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}

      # .env liegt persistent auf dem Host und wird NICHT aus dem Repo erzeugt.
      - name: Verify environment file
        run: |
          test -f "${DEPLOY_DIR}/.env" || {
            echo "::error::${DEPLOY_DIR}/.env fehlt auf dem Host."
            exit 1
          }
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}

      - name: Backup database
        working-directory: ${{ vars.DEPLOY_DIR }}
        run: |
          mkdir -p backups
          STAMP=$(date +%Y%m%d-%H%M%S)
          if [ -f data/teabot.db ]; then
            sqlite3 data/teabot.db "VACUUM INTO 'backups/teabot-${STAMP}.db'"
            echo "Backup: backups/teabot-${STAMP}.db"
          fi
          # Nur die letzten 14 Backups behalten
          ls -1t backups/teabot-*.db 2>/dev/null | tail -n +15 | xargs -r rm --

      - name: Build image
        run: docker compose --env-file "${DEPLOY_DIR}/.env" build --pull
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          COMPOSE_PROJECT_NAME: teabot

      - name: Directory writable?
        run: |
          docker compose --env-file "${DEPLOY_DIR}/.env" \
            run --rm app sh -c 'touch /app/data/.probe && rm /app/data/.probe'

      - name: Run migrations
        run: |
          docker compose --env-file "${DEPLOY_DIR}/.env" \
            run --rm app alembic upgrade head
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          COMPOSE_PROJECT_NAME: teabot
          ENV_FILE: ${{ vars.DEPLOY_DIR }}/.env

      - name: Restart stack
        run: docker compose --env-file "${DEPLOY_DIR}/.env" up -d --remove-orphans
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          COMPOSE_PROJECT_NAME: teabot

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:${{ vars.APP_PORT }}/health > /dev/null; then
              echo "Healthy nach ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Health check fehlgeschlagen"
          docker compose --env-file "${DEPLOY_DIR}/.env" logs --tail=100 app
          exit 1
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          COMPOSE_PROJECT_NAME: teabot

      - name: Prune dangling images
        if: success()
        run: docker image prune -f

      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file "${DEPLOY_DIR}/.env" logs --tail=200
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          COMPOSE_PROJECT_NAME: teabot
